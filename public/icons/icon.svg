<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.3"/>
  
  <!-- Stylized clipboard & check / count icon -->
  <g transform="translate(96, 80)">
    <!-- Clipboard body -->
    <rect x="20" y="50" width="280" height="340" rx="36" fill="#1e293b" stroke="#334155" stroke-width="8"/>
    <!-- Clip top -->
    <rect x="90" y="20" width="140" height="60" rx="18" fill="url(#gold)"/>
    <circle cx="160" cy="50" r="14" fill="#0f172a"/>
    <!-- Checklist items -->
    <rect x="60" y="130" width="50" height="50" rx="12" fill="url(#emerald)"/>
    <path d="M 72 155 L 82 165 L 98 145" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="130" y="142" width="130" height="24" rx="8" fill="#475569"/>

    <rect x="60" y="210" width="50" height="50" rx="12" fill="url(#emerald)"/>
    <path d="M 72 235 L 82 245 L 98 225" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="130" y="222" width="130" height="24" rx="8" fill="#475569"/>

    <rect x="60" y="290" width="50" height="50" rx="12" fill="url(#gold)"/>
    <!-- Counter badge "+1" -->
    <text x="85" y="325" font-family="sans-serif" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="middle">+1</text>
    <rect x="130" y="302" width="130" height="24" rx="8" fill="#475569"/>
  </g>
</svg>
